x-airflow-common:
  &airflow-common
  image: apache/airflow:slim-latest
  environment:
    &airflow-common-env
    AIRFLOW_EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres/airbnb
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
  volumes:
    - ./data:/opt/airflow/data
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - app-network

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: ["bash", "-c", "airflow db init && airflow db migrate"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airbnb
      _AIRFLOW_WWW_USER_PASSWORD: airbnb
      _AIRFLOW_WWW_USER_EMAIL: user123@gmail.com
      _AIRFLOW_WWW_USER_ROLE: Admin
    volumes:
      - .:/sources
    depends_on:
      - postgres
    networks:
      - app-network

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    environment:
      <<: *airflow-common-env 
    ports:
      - 8080:8080
    restart: always
    networks:
      - app-network
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    environment:
      <<: *airflow-common-env
    restart: always
    networks:
      - app-network
    depends_on:
      - airflow-init

  postgres:
    image: postgres:15.5-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airbnb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: always
    networks:
      - app-network
  
  mongo:
    image: skazuki/alpine-mongodb:${MONGODB_IMAGE_VERSION}
    container_name: ${MONGODB_CONTAINER_NAME}
    ports:
      - "${MONGODB_PORT}:27017"
    restart: always
    networks:
      - app-network
  
  mongo-express:
    image: mongo-express:${MONGO_EXPRESS_IMAGE_VERSION}
    container_name: ${MONGO_EXPRESS_CONTAINER_NAME}
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: "${MONGO_EXPRESS_ADMINUSERNAME}"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGO_EXPRESS_ADMINPASSWORD}"
      ME_CONFIG_MONGODB_SERVER: "${MONGO_EXPRESS_SERVER}"
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    restart: always
    networks:
      - app-network
    depends_on:
      - mongo

volumes:
  postgres-data:

networks:
  app-network:
    name: ${NETWORK_NAME}